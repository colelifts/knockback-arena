services:
  - type: web
    name: knockback-arena-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @knockback/shared && npm run build --workspace @knockback/server
    startCommand: npm run start --workspace @knockback/server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_TICK_RATE
        value: 30
      - key: SNAPSHOT_RATE
        value: 20
      - key: ROOM_RECONNECT_SECONDS
        value: 15
      - key: ROOM_IDLE_MINUTES
        value: 10
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        sync: false
